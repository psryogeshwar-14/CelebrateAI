name: CelebrateAI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Unit & Integration Tests
        run: npm run test

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          GEMINI_API_KEY: 'ci-mock-key'
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder-ci.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder-ci-anon-key'
