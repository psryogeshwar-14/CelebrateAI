<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafaf9" />
      <stop offset="100%" stop-color="#f5f5f4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Navbar -->
  <rect x="0" y="0" width="1200" height="72" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1" />
  <rect x="60" y="18" width="36" height="36" rx="8" fill="url(#goldGrad)" />
  <text x="78" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">✨</text>
  <text x="108" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#1c1917">Celebrate<tspan fill="#d97706">AI</tspan></text>

  <!-- Nav links -->
  <text x="450" y="42" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#78716c">Home</text>
  <text x="520" y="42" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#78716c">Plan Event</text>
  <text x="620" y="42" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#78716c">Dashboard</text>
  <text x="720" y="42" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#78716c">Budget</text>
  <text x="800" y="42" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#78716c">Timeline</text>
  <rect x="1000" y="18" width="140" height="36" rx="10" fill="url(#goldGrad)" />
  <text x="1070" y="41" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Try Live Demo</text>

  <!-- Hero Section -->
  <rect x="520" y="110" width="160" height="26" rx="13" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
  <text x="600" y="127" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#92400e" text-anchor="middle">★ PROMPTWARS CHALLENGE 5</text>

  <text x="600" y="185" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="44" fill="#1c1917" text-anchor="middle" letter-spacing="-0.03em">
    Plan every celebration with clarity, not chaos.
  </text>
  <text x="600" y="225" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#78716c" text-anchor="middle" max-width="800">
    CelebrateAI turns your brief into a budget that adds up, a timeline that works backwards from the big day,
  </text>
  <text x="600" y="250" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#78716c" text-anchor="middle">
    and a vendor checklist you can actually follow.
  </text>

  <!-- Hero Buttons -->
  <rect x="420" y="280" width="170" height="46" rx="12" fill="url(#goldGrad)" />
  <text x="505" y="308" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Plan Your Event &rarr;</text>
  <rect x="610" y="280" width="170" height="46" rx="12" fill="#ffffff" stroke="#d6d3d1" stroke-width="1" />
  <text x="695" y="308" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#1c1917" text-anchor="middle">Explore Bengaluru Demo</text>

  <!-- 3 Demo Event Cards -->
  <!-- Wedding -->
  <g transform="translate(100, 360)">
    <rect width="310" height="260" rx="18" fill="#ffffff" stroke="#e7e5e4" stroke-width="1" filter="url(#cardShadow)" />
    <rect x="20" y="20" width="36" height="36" rx="10" fill="#fff1f2" />
    <text x="38" y="44" font-size="18" text-anchor="middle">❤️</text>
    <rect x="210" y="22" width="80" height="22" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
    <text x="250" y="37" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">WEDDING</text>
    <text x="20" y="90" font-family="-apple-system, sans-serif" font-weight="800" font-size="17" fill="#1c1917">Ananya &amp; Vikram's Wedding</text>
    <text x="20" y="112" font-family="-apple-system, sans-serif" font-size="12" fill="#78716c">Palace Grounds, Bengaluru • 350 Guests</text>
    <text x="20" y="145" font-family="-apple-system, sans-serif" font-size="12" fill="#57534e" width="270">Udupi plantain feast, carved mandap, Mysore jasmine, live Nadaswaram.</text>
    <line x1="20" y1="195" x2="290" y2="195" stroke="#f5f5f4" stroke-width="1" />
    <text x="20" y="225" font-family="monospace" font-weight="700" font-size="15" fill="#1c1917">₹25,00,000</text>
    <text x="290" y="225" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#d97706" text-anchor="end">Launch Demo &rarr;</text>
  </g>

  <!-- Birthday -->
  <g transform="translate(445, 360)">
    <rect width="310" height="260" rx="18" fill="#ffffff" stroke="#e7e5e4" stroke-width="1" filter="url(#cardShadow)" />
    <rect x="20" y="20" width="36" height="36" rx="10" fill="#faf5ff" />
    <text x="38" y="44" font-size="18" text-anchor="middle">🎂</text>
    <rect x="210" y="22" width="80" height="22" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
    <text x="250" y="37" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">BIRTHDAY</text>
    <text x="20" y="90" font-family="-apple-system, sans-serif" font-weight="800" font-size="17" fill="#1c1917">Rohan's 30th Cyberpunk</text>
    <text x="20" y="112" font-family="-apple-system, sans-serif" font-size="12" fill="#78716c">Indiranagar 100ft Rd • 50 Guests</text>
    <text x="20" y="145" font-family="-apple-system, sans-serif" font-size="12" fill="#57534e">Rooftop sunset party, neon aesthetics, artisanal sliders &amp; retro arcade.</text>
    <line x1="20" y1="195" x2="290" y2="195" stroke="#f5f5f4" stroke-width="1" />
    <text x="20" y="225" font-family="monospace" font-weight="700" font-size="15" fill="#1c1917">₹1,50,000</text>
    <text x="290" y="225" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#d97706" text-anchor="end">Launch Demo &rarr;</text>
  </g>

  <!-- Community -->
  <g transform="translate(790, 360)">
    <rect width="310" height="260" rx="18" fill="#ffffff" stroke="#e7e5e4" stroke-width="1" filter="url(#cardShadow)" />
    <rect x="20" y="20" width="36" height="36" rx="10" fill="#f0fdf4" />
    <text x="38" y="44" font-size="18" text-anchor="middle">🎪</text>
    <rect x="195" y="22" width="95" height="22" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
    <text x="242" y="37" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">COMMUNITY</text>
    <text x="20" y="90" font-family="-apple-system, sans-serif" font-weight="800" font-size="17" fill="#1c1917">Koramangala Spring Mela</text>
    <text x="20" y="112" font-family="-apple-system, sans-serif" font-size="12" fill="#78716c">BDA Park 3rd Block • 600 Guests</text>
    <text x="20" y="145" font-family="-apple-system, sans-serif" font-size="12" fill="#57534e">Local artisan stalls, folk performances, compostable cutlery, eco park.</text>
    <line x1="20" y1="195" x2="290" y2="195" stroke="#f5f5f4" stroke-width="1" />
    <text x="20" y="225" font-family="monospace" font-weight="700" font-size="15" fill="#1c1917">₹4,00,000</text>
    <text x="290" y="225" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#d97706" text-anchor="end">Launch Demo &rarr;</text>
  </g>
</svg>
